apply plugin: 'com.android.application'
apply plugin: 'com.jakewharton.butterknife'

android {
    compileSdkVersion 33

    signingConfigs {
        config {
            keyAlias 'GDGF_PAD'
            keyPassword '888888'
            storeFile file('GDGF_PAD.jks')
            storePassword '888888'
        }
    }

    lintOptions {
        abortOnError false
    }

    defaultConfig {
        applicationId "com.grkj.ytjqy_pad"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 33
        versionCode 18
        versionName "1.1.8.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        ndk {
            moduleName "serial_port"
            ldLibs "log", "z", "m"
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }

    }
    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "boolean", "LOG_DEBUG", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            minifyEnabled false
            buildConfigField "boolean", "LOG_DEBUG", "true"
            signingConfig signingConfigs.config
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def createTime = new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
//            def fileName = "${buildType.name}_"+"appqyV"+"${defaultConfig.versionName}_${createTime}.apk"
            def fileName = "appqyV" + "${defaultConfig.versionName}_${createTime}.apk"
            outputFileName = fileName
        }
    }


    productFlavors {

    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            jni.srcDirs = []
            res.srcDirs =
                    [
                            'src/main/res/printer',
                            'src/main/res'
                    ]
        }
    }


//    sourceSets {
//        main {
//            //jni库的调用会到资源文件夹下libs里面找so文件
//            jni.srcDirs = []
//            jniLibs.srcDirs = ['libs']
//        }
//    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'AndroidManifest.xml'
        exclude 'androidsupportmultidexversion.txt'
    }
}

