apply plugin: 'com.android.library'
apply plugin: 'com.jakewharton.butterknife'

android {
    compileSdkVersion 33

    lintOptions{
        abortOnError false
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 14
        versionName "1.1.4.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        ndk {
            moduleName "serial_port"
            ldLibs "log", "z", "m"
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }

    }


    productFlavors {

    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            jni.srcDirs = []
            res.srcDirs =
                    [
//                            'src/main/res/printer',
                            'src/main/res'
                    ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

//    packagingOptions {
//        exclude 'AndroidManifest.xml'
//        exclude 'androidsupportmultidexversion.txt'
//    }
}

dependencies {
    implementation fileTree(include: ['*.jar','*.aar'], dir: 'libs')
//    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
//        exclude group: 'com.android.support', module: 'support-annotations'
//    })
//    implementation 'com.android.support:appcompat-v7:26.0.2'
//    implementation 'com.android.support:cardview-v7:26.0.2'
//    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
//    implementation 'com.android.support:design:26.0.2'
//    implementation 'junit:junit:4.12'
    implementation 'androidx.annotation:annotation:1.1.0'

    implementation project(path: ':FastBleLib')

    //log框架
    api 'com.github.zhaokaiqiang.klog:library:1.6.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'

    //得实打印机（dk320、dp385）
    api files('libs/deshi/dascom-1.0.823.2.jar')

    //V1 USB打印机
    api files('libs/android_print_sdk.jar')

    //V2 USB打印机
    api files('libs/gprintersdkv2.jar')

    //V3 USB打印机
    api files('libs/PosPrinterSDK.jar')

    //芝科打印机
    api files('libs/zp_cpcl_new.jar')

    //富矩源称
    api files('libs/WeighSDK.jar')

    //顺控
    api files('libs/tscsdk.jar')


    //河南打印机
//    api files('libs/jx_sdk_max_release_2.1.2_202503250938.aar')


//    implementation(name: 'jx_sdk_max_release_2.1.2_20250325093', ext: 'aar') // 仅限 APP 模块

    api project(path: ':module_aar')
//    implementation project(':module_aar')

    //USB称
    api 'com.github.felHR85:UsbSerial:6.0.3'
    api 'com.android.support:multidex:1.0.3'


    /*扫码*/
    api 'cn.bingoogolapple:bga-qrcode-zxing:1.3.6'
    //二维码框架
//    api files('libs/zxing.jar')

}
